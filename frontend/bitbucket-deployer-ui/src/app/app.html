<mat-toolbar color="primary" class="toolbar">
  <span class="title">Multi-Repo Deployment</span>
  <span class="spacer"></span>
  @if (authService.currentUser()?.isLoggedIn) {
    <a mat-button routerLink="/deploy" routerLinkActive="active-link">Dashboard</a>
    <a mat-button routerLink="/deployments" routerLinkActive="active-link">History</a>
    <span class="user-name">{{ authService.currentUser()?.displayName }}</span>
    <button mat-button type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
