<mat-form-field appearance="outline" class="branch-field">
  <mat-label>Branch</mat-label>
  <input
    matInput
    [formControl]="control"
    [readonly]="!repository()"
    [matAutocomplete]="branchPanel"
    (blur)="markTouched()"
    [placeholder]="repository() ? 'Search branches…' : 'Select a repository first'"
  />
  @if (loading()) {
    <mat-spinner matSuffix diameter="18" />
  } @else if (error()) {
    <mat-icon matSuffix color="warn" [matTooltip]="error()!">error_outline</mat-icon>
  }
  <mat-autocomplete #branchPanel="matAutocomplete">
    @for (branch of branches(); track branch.name) {
      <mat-option [value]="branch.name">{{ branch.name }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
